<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f62f0">
<title>얼굴 짝 맞추기 · 참가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Bungee&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Player controller: phone/tablet held upright. Status banner on top, 4x4 card pad below; the TV shows the photos, this shows names. */
:root {
  color-scheme: light;
  --table: #2f62f0; --table-deep: #1d44c4; --ink: #15193a; --paper: #fff; --soft: #eaf0ff;
  --sun: #ffd23f; --coral: #ff6047; --mint: #2fd18a; --muted: #5d6390;
  --f-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "Bungee", "Jua", Impact, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--ink); font-family: var(--f-body);
  background-image: radial-gradient(rgba(255,255,255,.13) 2px, transparent 2.5px); background-size: 24px 24px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
input { -webkit-user-select: text; user-select: text; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #fff; }
.top .t { font-family: var(--f-display); font-size: 20px; text-shadow: 0 2px 0 var(--ink); display: flex; align-items: center; gap: 8px; line-height: 1.1; }
.top .t .logo { height: 34px; background: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 5px; display: block; }
.top .t small { display: block; font-size: 12px; color: var(--sun); text-shadow: none; }
.me { background: var(--sun); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); border: 2px solid var(--ink); margin-right: 6px; vertical-align: middle; }
.dot.on { background: var(--mint); }
.card-box { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding: 18px; display: grid; gap: 12px; text-align: center; justify-items: center; }
.card-box.turn { background: var(--sun); }
.card-box.alarm { background: var(--coral); color: #fff; }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 32px; } h2 { font-size: 26px; }
p { margin: 0; color: var(--muted); line-height: 1.55; text-wrap: balance; }
.card-box.alarm p, .card-box.turn p { color: var(--ink); }
.card-box.alarm p { color: #fff; }
.big { font-family: var(--f-num); font-size: 56px; line-height: 1; }
form.join { display: grid; gap: 10px; width: 100%; }
.join input { width: 100%; border: 3px solid var(--ink); border-radius: 14px; padding: 14px; font-size: 24px; font-family: var(--f-display); text-align: center; }
.btn { border: 3px solid var(--ink); border-radius: 14px; padding: 14px 20px; font-family: var(--f-display); font-size: 22px; background: var(--sun); box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(5px); box-shadow: none; }
.btn.coral { background: var(--coral); color: #fff; }
.btn.white { background: var(--paper); }
.err { color: #c2321c; font-weight: 700; min-height: 1.4em; }
.order { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.order span { border: 2px solid var(--ink); border-radius: 10px; padding: 3px 10px; font-family: var(--f-display); font-size: 17px; background: var(--soft); }
.order span.me2 { background: var(--sun); box-shadow: 0 2px 0 var(--ink); }
.order span.on { background: var(--mint); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: var(--table-deep); border: 3px solid var(--ink); border-radius: 20px; padding: 12px; box-shadow: 0 5px 0 var(--ink); }
.pc { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: none; perspective: 600px; }
.pc .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,1.5,.5,1) var(--d, 0ms); }
.pc.up .in, .pc.done .in { transform: rotateY(180deg); }
.pc .f { position: absolute; inset: 0; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; display: grid; place-items: center; }
.pc .bk { background: var(--coral); background-image: radial-gradient(rgba(255,255,255,.22) 3px, transparent 3.5px); background-size: 16px 16px; }
.pc .fr { transform: rotateY(180deg); background: var(--paper); padding: 2px; }
.pc .fr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pc b { font-family: var(--f-num); font-size: clamp(20px, 7vw, 34px); color: var(--sun); -webkit-text-stroke: 1.5px var(--ink); }
.pc .nm { position: relative; font-family: var(--f-display); font-size: clamp(14px, 4.4vw, 21px); line-height: 1.1; word-break: keep-all; text-align: center; }
.pc .fr.ph { place-items: end stretch; padding: 0; }
.pc .fr.ph .nm { font-size: clamp(11px, 3.2vw, 15px); background: rgba(255,255,255,.92); border-top: 2px solid var(--ink); padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc.done .fr { border-color: #12945c; box-shadow: 0 4px 0 #12945c; }
.pc.done .fr::after { content: "✓"; position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--mint); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.pc.flipping { animation: lift .55s ease-out var(--d, 0ms); z-index: 2; }
@keyframes lift { 45% { transform: translateY(-8%) scale(1.15); filter: drop-shadow(0 12px 8px rgba(21,25,58,.35)); } }
.pc.pending .bk { outline: 4px solid var(--sun); outline-offset: -8px; }
.pc:disabled:not(.up):not(.done) .bk { filter: saturate(.55) brightness(.92); }
.pc:active:not(:disabled) .in { translate: 0 4px; }
.pc.gone { visibility: hidden; }
.pc .fr img.skull { position: absolute; inset: auto; left: 58%; top: 3%; width: 42%; height: auto; object-fit: contain; z-index: 3; pointer-events: none; filter: drop-shadow(0 3px 0 rgba(21,25,58,.45)); animation: stamp .5s .42s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes stamp { 0% { transform: scale(3.4) rotate(-35deg); opacity: 0; } 55% { transform: scale(.82) rotate(-6deg); opacity: 1; } 75% { transform: scale(1.06) rotate(-11deg); } 100% { transform: scale(1) rotate(-9deg); } }
.pc .fr img.anger { position: absolute; inset: auto; left: 58%; top: 3%; width: 40%; height: auto; object-fit: contain; z-index: 3; animation: stamp .5s cubic-bezier(.2,1.5,.4,1) both, throb .6s ease-in-out .5s infinite; }
@keyframes throb { 50% { scale: 1.18; } }
.pc.prof .fr { border-color: var(--coral); box-shadow: 0 0 0 4px var(--coral), 0 4px 0 var(--ink); }
.card-box.alarm q { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.3; color: #fff; quotes: "“" "”"; }
.storm { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
.storm img { position: absolute; width: var(--w); transform: rotate(var(--r)); animation: slam .42s cubic-bezier(.2,1.5,.4,1) var(--d) both; filter: drop-shadow(0 4px 0 rgba(21,25,58,.45)); }
@keyframes slam { 0% { opacity: 0; transform: scale(3) rotate(var(--r)); } 60% { opacity: 1; transform: scale(.86) rotate(var(--r)); } 100% { opacity: 1; transform: scale(1) rotate(var(--r)); } }
.pc.self .fr { border-color: var(--coral); box-shadow: 0 0 0 4px var(--coral), 0 4px 0 var(--ink); }
.pc.self .in { animation: shake .45s .42s 2; }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -5px; } 75% { translate: 5px; } }
.stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.stats span { background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 3px 10px; font-weight: 700; font-size: 14px; }
.list { width: 100%; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; background: var(--soft); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; text-align: left; }
.row.mine { background: var(--sun); }
.row .r { font-family: var(--f-num); }
.row .n { font-family: var(--f-display); font-size: 19px; }
.row .s { font-family: var(--f-num); font-size: 17px; }
.small { font-size: 13px; color: rgba(255,255,255,.9); text-align: center; }
.small button { background: none; border: 0; color: #fff; text-decoration: underline; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .pc .in { transition-duration: .25s; } .pc.flipping { animation: none; } }
</style>
</head>

const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let room = (qs.get("r") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
let brokerIdx = Math.min(BROKERS.length - 1, Math.max(0, parseInt(qs.get("b") || "0", 10) || 0));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const hk = new URLSearchParams(location.hash.slice(1)).get("k");
if (hk && room) store.set("fm-key-" + room, hk);
let pid = store.get("fm-pid"); if (!pid) { pid = "p" + Math.random().toString(36).slice(2, 12); store.set("fm-pid", pid); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
const fmt = ms => (ms / 1000).toFixed(1);

let photos = { id: null, map: {}, deck: null };
const opt = new Map(); // cards turned over locally, waiting for the host to confirm
async function onPhotos(m) {
  if (!m || !m.ct) { photos = { id: null, map: {}, deck: null }; return; }
  const k = store.get("fm-key-" + room);
  if (!k || !(window.crypto && crypto.subtle)) return;
  try {
    const d = x => Uint8Array.from(atob(x.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", d(k), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: d(m.iv) }, key, d(m.ct));
    const map = JSON.parse(new TextDecoder().decode(pt)), deck = Array.isArray(map["\u0000deck"]) ? map["\u0000deck"] : null;
    delete map["\u0000deck"];
    photos = { id: m.id, map, deck };
    render();
  } catch {}
}
let client = null, ok = false, st = null, me = null /* {name, team} or {tablet:true} */, err = "", pendingCard = null, lastWho = null, joining = false;
const saved = () => { try { return JSON.parse(store.get("fm-me-" + room) || "null"); } catch { return null; } };

/* tiny sounds for the controller */
let ac = null;
function beep(f, d = .1, type = "triangle", v = .3) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

function base() { return `labfacematch/v1/${room}`; }
function connect() {
  if (!room) return render();
  if (typeof mqtt === "undefined") { $("net").textContent = "통신 모듈을 불러오지 못했어요"; return; }
  $("roomTag").textContent = room;
  const c = client = mqtt.connect(BROKERS[brokerIdx], { clientId: "fmp_" + pid + "_" + Math.random().toString(16).slice(2, 6), clean: true, connectTimeout: 6000, reconnectPeriod: 2000, keepalive: 30 });
  c.on("connect", () => {
    ok = true; netUI();
    c.subscribe([base() + "/state", base() + "/img", base() + "/p/" + pid]);
    lastHid = null; lastAnn = 0; // (re)announce ourselves once the host's state arrives
    render();
  });
  c.on("close", () => { ok = false; netUI(); });
  c.on("message", (topic, payload) => {
    let m; try { m = payload.length ? JSON.parse(payload.toString()) : null; } catch { return; }
    if (topic.endsWith("/img")) { onPhotos(m); return; }
    if (!m) { if (topic.endsWith("/state")) onState(null); return; }
    if (topic.endsWith("/state")) { onState(m); return; }
    onReply(m);
  });
}
function netUI() { $("dot").classList.toggle("on", ok); $("net").textContent = ok ? (st ? "진행자와 연결됨" : "진행자 화면을 기다리는 중") : "연결 중…"; }
function sendMsg(obj) { if (client && ok) client.publish(base() + "/in", JSON.stringify({ ...obj, pid })); }
function onReply(m) {
  joining = false;
  if (m.type === "joined") { me = m.name ? { name: m.name, team: m.team, typed: typed || (saved() || {}).typed || "" } : { tablet: true }; store.set("fm-me-" + room, JSON.stringify(me)); err = ""; beep(880, .12); buzz(40); }
  else if (m.type === "who") { me = null; store.set("fm-me-" + room, null); }
  else if (m.type === "nope") { err = m.err || "다시 시도해 주세요."; pendingCard = null; opt.clear(); beep(220, .2, "square", .2); buzz([60, 40, 60]); }
  render();
}
let lastHid = null, lastAnn = 0, typed = "";
function announce() {
  const s = saved();
  if (s) { me = s; sendMsg(s.tablet ? { type: "join", tablet: true } : { type: "join", name: s.typed || s.name }); }
  else sendMsg({ type: "hello" });
}
function onState(m) {
  if (!m || !m.v) { st = null; netUI(); return render(); }
  if (m.pu && /^https:\/\//.test(m.pu) && m.pu.split(/[?#]/)[0] !== location.origin + location.pathname) {
    // the host links to a newer player page: move there, keeping room, server and photo key
    const tried = store.get("fm-moved");
    if (tried !== m.pu) { store.set("fm-moved", m.pu); location.replace(m.pu.split(/[?#]/)[0] + location.search + location.hash); return; }
  }
  if (m.hid !== lastHid) { lastHid = m.hid; if (Date.now() - lastAnn > 3000) { lastAnn = Date.now(); announce(); } } // host page opened or reloaded: tell it we are here
  const prevView = st && st.view;
  st = m; netUI();
  const myTurn = isMyTurn();
  if (st.who !== lastWho) { pendingCard = null; opt.clear(); if (myTurn) { beep(660, .1); setTimeout(() => beep(990, .16), 110); buzz([80, 60, 80]); } lastWho = st.who; }
  if (st.alarm && prevView !== "alarm") buzz(400);
  const storm = $("storm");
  if (st.ak === "prof" && !storm && SKULL) {
    buzz([300, 80, 300, 80, 600]); beep(70, 1.2, "sawtooth", .35);
    const d = document.createElement("div"); d.className = "storm"; d.id = "storm";
    const pc = document.querySelector(`.pc[data-i="${st.prof}"]`), box = pc ? pc.getBoundingClientRect() : null;
    const hd = $("head") ? $("head").getBoundingClientRect() : null;
    const over = (x, y, rad, r) => r && x + rad > r.left && x - rad < r.right && y + rad > r.top && y - rad < r.bottom;
    const hits = (x, y, rad) => over(x, y, rad, box) || over(x, y, rad, hd);
    d.innerHTML = Array.from({ length: 22 }, (_, k) => { const w = 50 + Math.random() * 70; let x, y, n = 0; do { x = Math.random() * 100; y = Math.random() * 100; } while (n++ < 30 && hits(x * innerWidth / 100, y * innerHeight / 100, w / 2 + 6)); return `<img src="${SKULL}" alt="" style="left:calc(${x}% - ${w / 2}px);top:calc(${y}% - ${w / 2}px);--w:${w}px;--r:${Math.round(Math.random() * 70 - 35)}deg;--d:${k * 40 + 450}ms">`; }).join("");
    document.body.appendChild(d);
  } else if (st.ak !== "prof" && storm) storm.remove();
  if (pendingCard != null && st.cards[pendingCard] && st.cards[pendingCard][0]) pendingCard = null;
  for (const i of [...opt.keys()]) if (!st.cards || st.view !== "play" || st.lock || (st.cards[i] && st.cards[i][0])) opt.delete(i);
  render();
}
function isMyTurn() {
  if (!st || st.view !== "play" || !me) return false;
  if (me.tablet) return true;
  return st.mode === "phone" && st.who === me.name;
}

/* ---------- views ---------- */
function render() {
  const v = $("view");
  const isPad = st && me && ok && (st.view === "peek" || st.view === "play");
  if (!isPad) v.dataset.v = "";
  $("me").hidden = !me; $("me").textContent = me ? (me.tablet ? "공용 태블릿" : `${me.name} · ${me.team || ""}`) : "";
  $("btnLeave").hidden = !me;
  if (!room) {
    v.innerHTML = `<div class="card-box"><h1>방 코드 입력</h1><p>TV 화면에 보이는 다섯 글자 코드를 입력하세요.</p>
      <form class="join" id="roomForm"><input id="roomIn" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" aria-label="방 코드"><button class="btn" type="submit">들어가기</button></form></div>`;
    $("roomForm").onsubmit = e => { e.preventDefault(); room = $("roomIn").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (room) connect(); };
    return;
  }
  if (!ok) { v.innerHTML = `<div class="card-box"><h2>연결하는 중…</h2><p>잠시만 기다려 주세요. 오래 걸리면 와이파이나 데이터를 확인해 주세요.</p></div>`; return; }
  if (!st) { v.innerHTML = `<div class="card-box"><h2>진행자 화면을 찾는 중…</h2><p>TV의 진행자 화면이 켜져 있는지, 방 코드 <b>${esc(room)}</b>가 맞는지 확인해 주세요.</p></div>`; return; }
  if (!me) return renderJoin(v);
  const fn = { lobby: vLobby, ready: vReady, count: vCount, peek: vPlay, play: vPlay, done: vDone, results: vResults }[st.view] || vLobby;
  if (st.alarm && st.view !== "play") return vAlarm(v);
  fn(v);
}
function renderJoin(v) {
  if (st.mode === "tablet") {
    v.innerHTML = `<div class="card-box"><h1>공용 태블릿</h1><p>이 기기를 돌려 가며 차례대로 카드를 고릅니다.</p>
      <button class="btn" id="tabBtn" type="button" ${joining ? "disabled" : ""}>이 기기로 입장</button><div class="err">${esc(err)}</div></div>`;
    $("tabBtn").onclick = () => { joining = true; err = ""; sendMsg({ type: "join", tablet: true }); render(); };
    return;
  }
  v.innerHTML = `<div class="card-box"><h1>이름을 입력하세요</h1><p>명단에 있는 이름 그대로 입력하면 조가 자동으로 정해져요.</p>
    <form class="join" id="joinForm" autocomplete="off"><input id="nameIn" maxlength="12" placeholder="홍길동" aria-label="이름"><button class="btn" type="submit" ${joining ? "disabled" : ""}>입장</button></form>
    <div class="err">${esc(err)}</div></div>`;
  $("joinForm").onsubmit = e => { e.preventDefault(); const n = $("nameIn").value.trim(); if (!n) return; typed = n; joining = true; err = ""; sendMsg({ type: "join", name: n }); beep(520, .06); setTimeout(() => { if (joining) { joining = false; err = "응답이 없어요. 진행자 화면이 켜져 있는지 확인해 주세요."; render(); } }, 6000); };
}
function scoreList() {
  const rows = (st.teams || []).slice().sort((a, b) => b.score - a.score);
  return `<div class="list">${rows.map((t, i) => `<div class="row ${me && t.name === me.team ? "mine" : ""}"><span class="r">${i + 1}</span><span class="n">${esc(t.name)}</span><span class="s">${t.score}</span></div>`).join("")}</div>`;
}
function vLobby(v) {
  v.innerHTML = `<div class="card-box"><h1>${me.tablet ? "입장 완료!" : `${esc(me.name)}${me.name.endsWith("님") ? "" : " 님"}, 입장 완료!`}</h1>
    <p>${me.tablet ? "진행자가 조를 고르면 시작해요." : `<b>${esc(me.team)}</b>예요. 우리 조 차례가 오면 이 화면에서 카드를 고릅니다.`}</p></div>
    <div class="card-box"><h2>${st.round}라운드 점수</h2>${scoreList()}</div>`;
}
function orderHTML() {
  return `<div class="order">${(st.order || []).map((n, i) => `<span class="${me && n === me.name ? "me2" : ""} ${st.turn === i && st.who ? "on" : ""}">${i + 1}. ${esc(n)}</span>`).join("")}</div>`;
}
function vReady(v) {
  const mine = me.tablet || st.team === me.team;
  const pos = me.name ? (st.order || []).indexOf(me.name) : -1;
  v.innerHTML = `<div class="card-box ${mine ? "turn" : ""}"><h1>${esc(st.team)} 준비</h1>
    ${orderHTML()}
    <p>${me.tablet ? "곧 시작해요. TV를 보세요!" : mine ? (pos >= 0 ? `나는 <b>${pos + 1}번째</b>예요. 앞사람이 한 쌍을 맞추면 내 차례!` : "TV에서 순서를 정하는 중이에요.") : "다른 조 차례예요. 같이 응원해요!"}</p></div>`;
}
function vCount(v) { v.innerHTML = `<div class="card-box turn"><h1>곧 시작!</h1><p>TV를 보세요. 카드가 잠깐 공개됩니다.</p></div>`; }
function vPlay(v) {
  const peek = st.view === "peek", my = isMyTurn(), mine = me.tablet || st.team === me.team;
  const head = st.alarm && st.ak === "prof"
    ? `<div class="card-box alarm"><h1>💢 ${esc(st.alarm)} 리셋!</h1><q>자네, 내 얼굴도 기억 못하는구만...</q><p>맞춘 카드가 모두 덮여요. <b>${esc(st.alarm)}</b>부터 다시!</p></div>`
    : st.alarm
    ? `<div class="card-box alarm"><h1>${esc(st.alarm)} 본인 등장! 💀</h1><p>맞춘 카드가 모두 덮여요. <b>${esc(st.alarm)}</b>부터 다시!</p></div>`
    : peek
    ? `<div class="card-box turn"><h1>외워 두세요!</h1><p>곧 모두 뒤집힙니다.</p></div>`
    : my ? `<div class="card-box turn"><h1>${me.tablet ? `${esc(st.who || "")} 차례!` : "내 차례!"}</h1><p>카드 두 장을 고르세요. <b>${me.tablet ? `${esc(st.who || "")} 본인 얼굴` : "내 얼굴"}</b>을 고르면 맞춘 카드가 전부 덮이고 <b>${me.tablet ? esc(st.who || "") : "나"}</b>부터 다시 시작!</p></div>`
    : `<div class="card-box"><h2>지금 차례: ${esc(st.who || "-")}</h2><p>${mine ? "앞사람이 맞추면 다음 사람 차례예요." : `${esc(st.team)} 진행 중`}</p></div>`;
  const cards = (st.cards || []).map((c, i) => c && !c[0] && opt.has(i) ? [1, opt.get(i)] : c);
  const upN = cards.filter(c => c && c[0] === 1).length;
  const pic = photos.id && photos.id === st.deck ? photos.map : {};
  // the pad stays in the DOM between updates so the cards can turn over instead of popping
  if (v.dataset.v !== "pad" || v.dataset.deck !== String(st.deck)) {
    v.dataset.v = "pad"; v.dataset.deck = String(st.deck);
    v.innerHTML = `<div id="head"></div><div class="pad" id="pad"></div><div class="stats" id="stats"></div><div class="err" id="perr" style="text-align:center;color:#fff"></div>`;
    $("pad").innerHTML = Array.from({ length: 16 }, (_, i) => `<button class="pc" data-i="${i}" type="button" aria-label="카드 ${i + 1}"><div class="in"><div class="f bk"><b>${i + 1}</b></div><div class="f fr"></div></div></button>`).join("");
    $("pad").querySelectorAll(".pc").forEach(b => b.onclick = () => {
      if (b.disabled) return;
      const i = +b.dataset.i; err = "";
      const deck = photos.deck && photos.id === st.deck ? photos.deck : null;
      if (deck && deck[i]) { opt.set(i, deck[i]); setTimeout(() => { if (opt.delete(i)) render(); }, 2500); }
      else { pendingCard = i; setTimeout(() => { if (pendingCard === i) { pendingCard = null; render(); } }, 2500); }
      sendMsg({ type: "flip", i }); beep(700, .05, "square", .15); buzz(20); render();
    });
  }
  $("head").innerHTML = head;
  const wave = st.view === "play" && cards.filter(c => c && c[0]).length === 0 && v._upN > 1; // reset: everything flips back in a wave
  let k = 0;
  $("pad").querySelectorAll(".pc").forEach(b => {
    const i = +b.dataset.i, c = cards[i];
    b.classList.toggle("gone", !c);
    if (!c) { b.disabled = true; return; }
    const was = b.classList.contains("up") || b.classList.contains("done"), now = c[0] > 0;
    if (now) {
      const fr = b.querySelector(".fr"), src = pic[c[1]] || "";
      if (fr.dataset.nm !== c[1] || fr.dataset.src !== src) {
        fr.dataset.nm = c[1]; fr.dataset.src = src; fr.classList.toggle("ph", !!src);
        fr.innerHTML = (src ? `<img src="${src}" alt="">` : "") + `<span class="nm">${esc(c[1])}</span>`;
      }
    }
    if (was !== now) {
      b.style.setProperty("--d", wave && was ? (k++ * 70) + "ms" : "0ms");
      b.classList.remove("flipping"); void b.offsetWidth; b.classList.add("flipping");
    }
    b.classList.toggle("up", c[0] === 1); b.classList.toggle("done", c[0] === 2);
    const sk = !!st.alarm && st.self === i, old = b.querySelector(".skull");
    b.classList.toggle("self", sk);
    if (sk && !old && SKULL) b.querySelector(".fr").insertAdjacentHTML("beforeend", `<img class="skull" src="${SKULL}" alt="해골 도장">`);
    if (!sk && old) old.remove();
    const pk = !!st.alarm && st.ak === "prof" && st.prof === i, oa = b.querySelector(".anger");
    b.classList.toggle("prof", pk);
    if (pk && !oa && ANGER) b.querySelector(".fr").insertAdjacentHTML("beforeend", `<img class="anger" src="${ANGER}" alt="빠직">`);
    if (!pk && oa) oa.remove();
    b.classList.toggle("pending", pendingCard === i);
    b.disabled = !(my && !peek && !st.lock && c[0] === 0 && pendingCard == null && upN < 2);
  });
  v._upN = cards.filter(c => c && c[0]).length;
  $("stats").innerHTML = `<span>${esc(st.team || "")}</span><span>맞춘 쌍 ${st.pairs}/8</span><span>리셋 ${st.resets}</span>`;
  $("perr").textContent = err;
}
function vAlarm(v) { v.innerHTML = `<div class="card-box alarm"><h1>${esc(st.alarm)}<br>본인 등장! 💀</h1><p>맞춘 카드가 모두 덮여요. <b>${esc(st.alarm)}</b>부터 다시!</p></div>`; }
function vDone(v) {
  const t = (st.teams || []).find(x => x.name === st.team);
  v.innerHTML = `<div class="card-box turn"><h1>${esc(st.team)} 완료!</h1>${t && t.time != null ? `<div class="big">${fmt(t.time)}<span style="font-size:.4em">초</span></div>` : ""}<p>TV에서 다음 조를 기다려요.</p></div>`;
}
function vResults(v) { v.innerHTML = `<div class="card-box"><h1>🏆 ${st.round}라운드 결과</h1>${scoreList()}<p>누적 점수 순서예요.</p></div>`; }

$("btnLeave").onclick = () => { me = null; store.set("fm-me-" + room, null); err = ""; render(); };
connect(); render();
</script>
</body>
</html>
